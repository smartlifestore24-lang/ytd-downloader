<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ফেসবুক ভিডিও ও রিলস ডাউনলোডার</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; text-align: center; }
        .nav-container { display: flex; flex-wrap: wrap; justify-content: center; background: #444; padding: 10px; }
        .nav-container a { color: white; text-decoration: none; padding: 10px 15px; margin: 5px; border-radius: 5px; font-weight: bold; }
        .fb { background: #1877f2; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input[type="text"] { width: 85%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 25px; background-color: #1877f2; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        #res { margin-top: 25px; }
        .dl-btn { display: inline-block; margin-top: 15px; padding: 12px 25px; background-color: #1877f2; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

<div class="nav-container">
    <a href="/" style="background: #666;">হোম</a>
    <a href="/youtube" style="background: #ff0000;">YouTube</a>
    <a href="/tiktok" style="background: #010101;">TikTok</a>
    <a href="/facebook" class="fb">Facebook</a>
</div>

<div class="container">
    <h2 style="color: #1877f2;">ফেসবুক ভিডিও ও রিলস ডাউনলোডার 🌐</h2>
    <p>ফেসবুক ভিডিও, রিলস বা ওয়াচ ভিডিওর লিংক এখানে দিন:</p>
    <input type="text" id="url" placeholder="https://www.facebook.com/... / https://fb.watch/...">
    <br>
    <button onclick="downloadFB()">লিংক জেনারেট করুন</button>
    <div id="res"></div>
</div>

<script>
    async function downloadFB() {
        const videoUrl = document.getElementById('url').value;
        if (!videoUrl) return alert('অনুগ্রহ করে একটি ফেসবুক লিংক দিন!');
        
        const resDiv = document.getElementById('res');
        resDiv.innerHTML = '🌐 ফেসবুক ভিডিও প্রসেস করা হচ্ছে...';

        try {
            const response = await fetch(`https://api.vvevio.com/download?url=${encodeURIComponent(videoUrl)}`);
            const data = await response.json();

            if (data && data.url) {
                resDiv.innerHTML = `
                    <h3>${data.title || 'Facebook Video'}</h3>
                    ${data.thumbnail ? `<img src="${data.thumbnail}" width="280" style="border-radius:8px;"><br>` : ''}
                    <a href="${data.url}" target="_blank" class="dl-btn">ভিডিও ডাউনলোড করুন (HD/SD)</a>
                `;
            } else {
                resDiv.innerHTML = '<p style="color:red;">লিংকটি থেকে পাবলিক ভিডিও ফাইলটি উদ্ধার করা যায়নি। ভিডিওটি পাবলিক কি না নিশ্চিত হোন।</p>';
            }
        } catch (error) {
            resDiv.innerHTML = '<p style="color:red;">ত্রুটি হয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।</p>';
        }
    }
</script>
</body>
</html>
