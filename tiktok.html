<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>টিকটক ভিডিও ডাউনলোডার - ওয়াটারমার্ক ছাড়া</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; text-align: center; }
        .nav-container { display: flex; flex-wrap: wrap; justify-content: center; background: #444; padding: 10px; }
        .nav-container a { color: white; text-decoration: none; padding: 10px 15px; margin: 5px; border-radius: 5px; font-weight: bold; }
        .tt { background: #010101; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input[type="text"] { width: 85%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 25px; background-color: #010101; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        #res { margin-top: 25px; }
        .dl-btn { display: inline-block; margin-top: 15px; padding: 12px 25px; background-color: #ee1d52; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

<div class="nav-container">
    <a href="/" style="background: #666;">হোম</a>
    <a href="/youtube" style="background: #ff0000;">YouTube</a>
    <a href="/tiktok" class="tt">TikTok</a>
    <a href="/facebook" style="background: #1877f2;">Facebook</a>
</div>

<div class="container">
    <h2 style="color: #010101;">টিকটক ভিডিও ডাউনলোডার 🎵</h2>
    <p>কোনো ওয়াটারমার্ক (Watermark) ছাড়াই হাই কোয়ালিটি টিকটক ভিডিও ডাউনলোড করুন:</p>
    <input type="text" id="url" placeholder="https://www.tiktok.com/@...">
    <br>
    <button onclick="downloadTikTok()">ভিডিও তৈরি করুন</button>
    <div id="res"></div>
</div>

<script>
    async function downloadTikTok() {
        const videoUrl = document.getElementById('url').value;
        if (!videoUrl) return alert('অনুগ্রহ করে একটি সঠিক টিকটক লিংক দিন!');
        
        const resDiv = document.getElementById('res');
        resDiv.innerHTML = '🎵 টিকটক ভিডিও স্ক্যান করা হচ্ছে... একটু অপেক্ষা করুন...';

        try {
            // টিকটকের জন্য বিশেষভাবে তৈরি ওপেন এপিআই মেথড
            const response = await fetch(`https://api.tik-wm.com/api/v1/user/video?url=${encodeURIComponent(videoUrl)}`);
            const data = await response.json();

            if (data && data.code === 0 && data.data) {
                resDiv.innerHTML = `
                    <h3>${data.data.title || 'TikTok Video'}</h3>
                    <img src="${data.data.cover}" width="200" style="border-radius:8px;"><br>
                    <a href="${data.data.play}" target="_blank" class="dl-btn">ওয়াটারমার্ক ছাড়া ডাউনলোড</a>
                `;
            } else {
                resDiv.innerHTML = '<p style="color:red;">ভিডিওর সোর্স ফাইলটি পাওয়া যায়নি! লিংকটি সঠিক কি না চেক করুন।</p>';
            }
        } catch (error) {
            resDiv.innerHTML = '<p style="color:red;">সার্ভার ওভারলোড দেখাচ্ছে, আবার চেষ্টা করুন।</p>';
        }
    }
</script>
</body>
</html>
