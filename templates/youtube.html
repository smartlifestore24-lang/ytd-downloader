<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ইউটিউব ভিডিও ডাউনলোডার</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; text-align: center; }
        .nav-container { display: flex; flex-wrap: wrap; justify-content: center; background: #444; padding: 10px; }
        .nav-container a { color: white; text-decoration: none; padding: 10px 15px; margin: 5px; border-radius: 5px; font-weight: bold; }
        .yt { background: #ff0000; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input[type="text"] { width: 85%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { padding: 12px 25px; background-color: #ff0000; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        #res { margin-top: 25px; }
        .dl-btn { display: inline-block; margin-top: 15px; padding: 12px 25px; background-color: #28a745; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
<div class="nav-container">
    <a href="/" style="background: #666;">হোম</a>
    <a href="/youtube" class="yt">YouTube</a>
    <a href="/tiktok" style="background: #010101;">TikTok</a>
    <a href="/facebook" style="background: #1877f2;">Facebook</a>
</div>
<div class="container">
    <h2 style="color: #ff0000;">ইউটিউব ভিডিও ডাউনলোডার 🎥</h2>
    <input type="text" id="url" placeholder="এখানে ইউটিউব ভিডিওর লিংক দিন...">
    <br>
    <button onclick="download()">লিংক জেনারেট করুন</button>
    <div id="res"></div>
</div>
<script>
    async function download() {
        const u = document.getElementById('url').value;
        if (!u) return alert('লিংক দিন!');
        document.getElementById('res').innerHTML = '⚡ আমাদের নিজস্ব সার্ভার কোড প্রসেস করছে... অপেক্ষা করুন...';
        
        const r = await fetch('/fetch_video', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({url: u})
        });
        const d = await r.json();
        if (d.error) document.getElementById('res').innerHTML = `<p style="color:red;">${d.error}</p>`;
        else {
            document.getElementById('res').innerHTML = `
                <h3>${d.title}</h3>
                <img src="${d.thumbnail}" width="250" style="border-radius:8px;"><br>
                <a href="${d.download_url}" target="_blank" class="dl-btn">ডাউনলোড করুন</a>
            `;
        }
    }
</script>
</body>
</html>
